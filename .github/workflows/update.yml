name: Update ranking

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency: ranking

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install apify-client openpyxl
      - name: Collect views
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          python bxd_count.py --bloggers bloggers.csv --start 2026-10-01 --end 2026-11-03 \
            --max-videos 15 --json results.json --out result.xlsx
        #   cp results.json docs/results.json
      - name: Commit data
        run: |
          git config user.name "bxd-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/results.json
          git diff --cached --quiet || git commit -m "Update ranking data"
          git push