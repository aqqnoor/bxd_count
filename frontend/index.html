<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BXD Battle: мониторинг просмотров</title>
<meta name="description" content="Мониторинг BXD Battle: рейтинг всех участников по сумме просмотров роликов с хэштегом BXDBATTLE.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
  :root {
    --hero: #4A2BE0;
    --hero-ink: #FFFFFF;
    --hero-soft: rgba(255, 255, 255, .8);
    --gold: #FFD23F;
    --silver: #D5D9E6;
    --bronze: #E8A468;
    --medal-ink: #20190A;
    --bg: #F3F1FA;
    --surface: #FFFFFF;
    --lead-bg: #FFF7D6;
    --ink: #17123A;
    --muted: #5E5988;
    --line: #DDD9EE;
    --bar: #5A3DF0;
    --up: #0B7A43;
    --down: #B3261E;
    --focus: #1D4ED8;
    --font: "Archivo", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --hero: #2A1A8C;
      --bg: #12102A;
      --surface: #1B1840;
      --lead-bg: #2C2650;
      --ink: #EFEDFF;
      --muted: #A9A5D6;
      --line: #2E2A5E;
      --bar: #8F7BFF;
      --up: #5BE39B;
      --down: #FF8A80;
      --focus: #9DB4FF;
    }
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px;
    line-height: 1.4; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 0 16px; }

  /* ---- шапка ---- */
  .hero { background: var(--hero); color: var(--hero-ink); padding: 26px 0 22px; }
  .top { display: flex; flex-wrap: wrap; gap: 12px 28px; align-items: center; justify-content: space-between; }
  h1 { margin: 0; font-size: clamp(34px, 7vw, 56px); line-height: .95; font-weight: 850;
    font-variation-settings: "wdth" 125; letter-spacing: -0.02em; }
  .live { display: inline-flex; align-items: center; gap: 10px; font-size: 14px; color: var(--hero-soft);
    background: rgba(255,255,255,.12); border-radius: 999px; padding: 8px 16px; }
  .live .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--gold); flex: none; }
  .live.running .dot { animation: pulse 1.2s ease-in-out infinite; }
  .live.stale .dot { background: #FF8A80; }
  .live b { color: var(--hero-ink); font-weight: 650; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,210,63,.7); } 50% { box-shadow: 0 0 0 7px rgba(255,210,63,0); } }

  .stats { display: flex; flex-wrap: wrap; gap: 6px 36px; margin: 20px 0 0; font-size: 15px; color: var(--hero-soft); }
  .stats b { display: block; font-size: clamp(22px, 3.4vw, 30px); font-weight: 850; color: var(--hero-ink);
    font-variation-settings: "wdth" 112; font-variant-numeric: tabular-nums; line-height: 1.15; }

  /* ---- таблица ---- */
  main.wrap { padding-top: 22px; padding-bottom: 56px; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .caption { color: var(--muted); font-size: 14px; max-width: 60ch; }
  .search { font: inherit; font-size: 15px; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line);
    border-radius: 10px; padding: 8px 12px; min-width: 230px; }
  .search::placeholder { color: var(--muted); }
  .search:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  .head, .row { display: grid; grid-template-columns: 44px 58px minmax(110px, 1.1fr) 2fr 150px; align-items: center; gap: 4px 16px; }
  .head { padding: 0 12px 6px; font-size: 13px; color: var(--muted); font-weight: 600; }
  .head .r { text-align: right; }
  ol.board { list-style: none; margin: 0; padding: 0; position: relative; }
  .row { padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; }
  .row[hidden] { display: none; }
  .row.moving { transition: transform .8s cubic-bezier(.2,.7,.2,1); position: relative; z-index: 1; }
  .row.t1 { background: var(--lead-bg); border-color: var(--gold); }

  .rank { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 850;
    font-variation-settings: "wdth" 112; font-variant-numeric: tabular-nums; font-size: 15px; background: var(--bg); color: var(--ink); }
  .t1 .rank { background: var(--gold); color: var(--medal-ink); }
  .t2 .rank { background: var(--silver); color: var(--medal-ink); }
  .t3 .rank { background: var(--bronze); color: var(--medal-ink); }

  .mv { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--muted); }
  .mv.up { color: var(--up); } .mv.down { color: var(--down); }
  .mv.up::before { content: "▲ "; font-size: 10px; vertical-align: 1px; }
  .mv.down::before { content: "▼ "; font-size: 10px; vertical-align: 1px; }

  .name { font-weight: 650; font-size: 17px; overflow-wrap: anywhere; min-width: 0; }
  .t1 .name { font-size: 19px; font-weight: 750; }
  .note { display: block; font-size: 12px; font-weight: 600; color: var(--down); }
  .track { height: 12px; display: flex; min-width: 0; }
  .bar { height: 100%; width: 0; border-radius: 3px; background: var(--bar); transition: width .9s cubic-bezier(.2,.7,.2,1); }
  .empty { font-size: 14px; color: var(--muted); }
  .views { text-align: right; font-weight: 850; font-size: 21px; font-variant-numeric: tabular-nums; font-variation-settings: "wdth" 108; }
  .t1 .views { font-size: 24px; }
  .views small { display: block; font-size: 12px; font-weight: 650; color: var(--muted); font-variation-settings: "wdth" 100; min-height: 1em; }
  .views small.plus { color: var(--up); }

  .msg { margin: 20px 0; padding: 16px 18px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; }
  .msg[hidden] { display: none; }
  footer { margin-top: 24px; font-size: 13px; color: var(--muted); max-width: 72ch; }

  @media (max-width: 680px) {
    .head { display: none; }
    .row { grid-template-columns: 38px 1fr auto; padding: 12px 12px 14px; }
    .mv { grid-column: 1; grid-row: 2; text-align: center; font-size: 12px; }
    .name { grid-column: 2; grid-row: 1; }
    .views { grid-column: 3; grid-row: 1; font-size: 18px; }
    .t1 .views { font-size: 20px; }
    .track { grid-column: 2 / 4; grid-row: 2; }
    .views small { display: block; }
  }
  @media (prefers-reduced-motion: reduce) { .bar, .row.moving { transition: none; } .live.running .dot { animation: none; } }
</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <div class="top">
      <h1>BXD Battle</h1>
      <div class="live" id="live" aria-live="polite"><i class="dot"></i><span id="liveText">Загружаем данные…</span></div>
    </div>
    <div class="stats" id="stats"></div>
  </div>
</header>

<main class="wrap">
  <div class="controls">
    <p class="caption" id="caption"></p>
    <input class="search" id="q" type="search" placeholder="Найти участника" aria-label="Найти участника">
  </div>
  <div class="head" aria-hidden="true">
    <span>Место</span><span>Сдвиг</span><span>Участник</span><span></span><span class="r">Просмотры</span>
  </div>
  <ol class="board" id="board"></ol>
  <div class="msg" id="msg" hidden></div>
  <footer id="foot"></footer>
</main>

<script>
(function () {
  "use strict";
  // Сначала API бэкенда; если его нет (статический хостинг), читаем results.json рядом со страницей
  var DATA_URLS = ["api/ranking", "results.json"];
  var POLL_MS = 30 * 1000, POLL_RUNNING_MS = 10 * 1000, STALE_AFTER_MS = 36 * 3600e3;

  var state = { data: null, q: "", stamp: null, rows: new Map(), first: true };
  var $ = function (id) { return document.getElementById(id); };
  var nf = new Intl.NumberFormat("ru-RU");
  function fmt(n) { return nf.format(n); }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function day(iso) { return new Date(iso + "T12:00:00").toLocaleDateString("ru-RU", { day: "numeric", month: "long" }); }

  function ago(ms) {
    var m = Math.floor(ms / 60000);
    if (m < 1) return "только что";
    if (m < 60) return m + " мин назад";
    var h = Math.floor(m / 60);
    if (h < 24) return h + " ч назад";
    var d = Math.floor(h / 24);
    return d + " дн назад";
  }

  function renderLive() {
    var d = state.data; if (!d) return;
    var box = $("live"), txt = $("liveText");
    box.classList.toggle("running", !!d.running);
    if (d.running) { box.classList.remove("stale"); txt.innerHTML = "<b>Идёт обновление данных…</b>"; return; }
    if (!d.generated_at) { box.classList.add("stale"); txt.textContent = "Данные ещё не собраны"; return; }
    var t = new Date(d.generated_at), age = Date.now() - t.getTime();
    box.classList.toggle("stale", age > STALE_AFTER_MS);
    txt.textContent = "";
    txt.append("Обновлено ", Object.assign(document.createElement("b"), { textContent: ago(age) }),
      ", " + t.toLocaleString("ru-RU", { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" }));
  }

  function renderStatic(d) {
    $("caption").textContent = "Просмотры роликов с хэштегом #" + d.hashtag + ". Период: с " + day(d.period.start) + " по " + day(d.period.end) + ".";
    var leader = d.rows.length && d.rows[0].total != null ? d.rows[0] : null;
    $("stats").innerHTML = "";
    var add = function (label, value) { var s = el("span"); s.append(el("b", null, value), label); $("stats").appendChild(s); };
    add("всего просмотров", fmt(d.totals.views));
    add("участников", String(d.totals.bloggers));
    if (leader) add("лидирует", leader.name);
    $("foot").textContent = "Считаются ролики, у которых хэштег #" + d.hashtag + " указан в подписи и которые опубликованы " +
      "в период кампании. Количество роликов на место в рейтинге не влияет. Стрелка показывает, на сколько мест участник " +
      "поднялся или опустился с прошлого обновления, а «+» под числом — прирост просмотров за это время. " +
      "Пометка «данные неполные» значит, что часть данных участника получить не удалось.";
  }

  function keyOf(r) { return r.id != null ? "id" + r.id : "n" + r.name; }

  function makeRow(r) {
    var li = el("li", "row");
    li._mv = el("div", "mv"); li._rank = el("div", "rank");
    li._who = el("div", "name"); li._nameText = el("span"); li._note = el("span", "note");
    li._who.append(li._nameText, li._note);
    li._track = el("div", "track"); li._views = el("div", "views"); li._small = el("small");
    li.append(li._rank, li._mv, li._who, li._track, li._views);
    return li;
  }

  function fillRow(li, r, max) {
    li.className = "row" + (r.rank <= 3 && r.total != null ? " t" + r.rank : "");
    li._rank.textContent = String(r.rank);
    li._nameText.textContent = r.name;
    li._note.textContent = r.complete ? "" : "данные неполные";
    li._note.title = r.status || "";
    // движение по рейтингу
    var mv = li._mv, c = r.rank_change;
    mv.className = "mv";
    if (c == null) { mv.textContent = ""; mv.setAttribute("aria-label", ""); }
    else if (c > 0) { mv.classList.add("up"); mv.textContent = String(c); mv.setAttribute("aria-label", "поднялся на " + c); }
    else if (c < 0) { mv.classList.add("down"); mv.textContent = String(-c); mv.setAttribute("aria-label", "опустился на " + (-c)); }
    else { mv.textContent = "—"; mv.setAttribute("aria-label", "без изменений"); }
    // просмотры и полоса
    li._track.innerHTML = ""; li._views.innerHTML = ""; li._bar = null;
    if (r.total == null) {
      li._track.appendChild(el("span", "empty", "нет данных"));
      li._views.textContent = "—";
    } else {
      var bar = el("div", "bar");
      bar.setAttribute("role", "img"); bar.setAttribute("aria-label", r.name + ": " + fmt(r.total) + " просмотров");
      bar.dataset.w = max ? (r.total / max) * 100 : 0;
      li._bar = bar; li._track.appendChild(bar);
      li._views.append(fmt(r.total));
      var sm = el("small", r.delta > 0 ? "plus" : "", r.delta == null ? "" : r.delta > 0 ? "+" + fmt(r.delta) : "без прироста");
      li._views.appendChild(sm);
    }
  }

  function render() {
    var d = state.data; if (!d) return;
    var board = $("board"), q = state.q.trim().toLowerCase();
    var max = d.rows.reduce(function (m, r) { return Math.max(m, r.total || 0); }, 0);

    // запоминаем, где строки стояли до обновления
    var before = new Map();
    state.rows.forEach(function (li, k) { if (li.isConnected && !li.hidden) before.set(k, li.getBoundingClientRect().top); });

    var seen = {};
    d.rows.forEach(function (r) {
      var k = keyOf(r); seen[k] = true;
      var li = state.rows.get(k);
      if (!li) { li = makeRow(r); state.rows.set(k, li); }
      fillRow(li, r, max);
      var hit = !q || (r.name + " " + (r.tiktok || "") + " " + (r.instagram || "")).toLowerCase().indexOf(q) !== -1;
      li.hidden = !hit;
      board.appendChild(li); // порядок = порядок данных
    });
    state.rows.forEach(function (li, k) { if (!seen[k]) { li.remove(); state.rows.delete(k); } });

    // полосы: при первой загрузке растут, дальше меняются плавно
    var apply = function () { state.rows.forEach(function (li) { if (li._bar) li._bar.style.width = li._bar.dataset.w + "%"; }); };
    if (state.first) { requestAnimationFrame(function () { requestAnimationFrame(apply); }); } else apply();

    // плавная перестановка строк при обновлении (без анимации во время поиска)
    if (!state.first && !q && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
      state.rows.forEach(function (li, k) {
        if (!before.has(k) || li.hidden) return;
        var dy = before.get(k) - li.getBoundingClientRect().top;
        if (Math.abs(dy) < 2) return;
        li.classList.remove("moving"); li.style.transform = "translateY(" + dy + "px)";
        requestAnimationFrame(function () { requestAnimationFrame(function () {
          li.classList.add("moving"); li.style.transform = "";
          setTimeout(function () { li.classList.remove("moving"); }, 900);
        }); });
      });
    }
    state.first = false;

    var msg = $("msg");
    if (!d.rows.length) { msg.hidden = false; msg.textContent = "Пока нет данных для рейтинга."; }
    else if (q && !Array.from(state.rows.values()).some(function (li) { return !li.hidden; })) {
      msg.hidden = false; msg.textContent = "Никого не нашли. Проверьте написание имени или ника.";
    } else msg.hidden = true;
  }

  function fetchJson(i) {
    if (i >= DATA_URLS.length) return Promise.reject(new Error("no source"));
    return fetch(DATA_URLS[i] + "?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        if ((r.headers.get("content-type") || "").indexOf("json") === -1) throw new Error("not json");
        return r.json();
      })
      .catch(function () { return fetchJson(i + 1); });
  }

  function load() {
    return fetchJson(0)
      .then(function (d) {
        var stamp = String(d.generated_at) + "|" + !!d.running;
        if (state.stamp === stamp && state.data) return;
        state.stamp = stamp; state.data = d;
        renderStatic(d); render(); renderLive();
      })
      .catch(function () {
        if (!state.data) {
          var m = $("msg"); m.hidden = false;
          m.textContent = "Не удалось загрузить данные. Обновите страницу через минуту.";
          $("liveText").textContent = "Нет связи с сервером";
        }
      })
      .then(function () { setTimeout(load, state.data && state.data.running ? POLL_RUNNING_MS : POLL_MS); });
  }

  $("q").addEventListener("input", function (e) { state.q = e.target.value; render(); });
  setInterval(renderLive, 30 * 1000); // «обновлено N мин назад» тикает сам
  load();
})();
</script>
</body>
</html>
